services:
  backend:
    container_name: carpub-backend
    restart: unless-stopped
    image: dexter.fit.vutbr.cz/carpub/carpub-backend
    env_file:
      - .env
    environment:
      - API_BASE_URL=/carpub
    healthcheck:
      # Deno image without wget/curl; python3 is there. transferStops = static list, ~6 ms
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/carpub/api/transferStops', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - carpubNetwork

  frontend:
    container_name: carpub-frontend
    restart: unless-stopped
    image: dexter.fit.vutbr.cz/carpub/carpub-frontend
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget tries ::1 first, nginx listens on IPv4 only
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/carpub/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - carpubNetwork

  proxy:
    container_name: carpub-proxy
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - carpubNetwork
      - network

networks:
  network:
    name: kristyna-dev
    external: true
  carpubNetwork:
    name: carpubNetwork
