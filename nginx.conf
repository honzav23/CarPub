events {}

http {
    include mime.types;

    upstream be {
        server carpub-backend:8000;
    }

    upstream fe {
        server carpub-frontend;
    }

    server {
        listen 80;

        # Docker healthcheck of the proxy itself (docker-compose.prod.yml)
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        include /etc/nginx/mime.types;

        location /carpub/api {
            proxy_pass http://be/carpub/api;
        }

        location /carpub {
            proxy_pass http://fe;
        }
    }
}
